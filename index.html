<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy July 4th — Fireworks</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e1a; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { position: relative; width: 100%; max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; background: #0a0e1a; border-radius: 12px; cursor: crosshair; }
  #banner {
    position: absolute; top: 5%; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 800 clamp(28px, 6vw, 56px)/1.1 Georgia, 'Times New Roman', serif; letter-spacing: .5px; color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,.55), 0 0 26px rgba(120,160,255,.5);
  }
  #banner sup { font-size: .6em; vertical-align: top; }
  #sound {
    position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 10px;
    font: 13px system-ui, sans-serif; cursor: pointer;
  }
  #hint {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font: 13px system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="fw" width="900" height="560"></canvas>
  <div id="banner">Happy July 4<sup>th</sup></div>
  <button id="sound">🔇 Sound off</button>
  <div id="hint">Auto-firing • click to launch your own 🎆</div>
</div>
<script>
(function(){
  var c = document.getElementById('fw');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  var rockets = [], sparks = [];
  var soundBtn = document.getElementById('sound');

  function rand(a,b){ return a + Math.random()*(b-a); }
  function hsl(h,s,l){ return 'hsl('+h+','+s+'%,'+l+'%)'; }

  // ---- Sound (Web Audio, no files) ----
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null, soundOn = false;

  function ensureAudio(){
    if(!actx && AC) actx = new AC();
    if(actx && actx.state === 'suspended') actx.resume();
  }
  soundBtn.addEventListener('click', function(){
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
  });

  function boomSound(){
    if(!soundOn || !actx) return;
    var t = actx.currentTime, dur = 0.6;
    var buf = actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2); }
    var src = actx.createBufferSource(); src.buffer = buf;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    var lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1200;
    src.connect(lp).connect(g).connect(actx.destination);
    src.start(t);
  }

  // ---- Color palettes: lean red/white/blue for the 4th, plus some variety ----
  var palettes = [
    [0, 5, 355],       // reds
    [210, 220, 230],   // blues
    [0, 0, 0],         // white (saturation handled below)
    [0, 355, 210],     // mixed red/blue
    [30, 45, 200]      // gold + blue
  ];
  var palIdx = 0;
  function nextColor(){
    var p = palettes[palIdx];
    var h = p[Math.floor(Math.random()*p.length)] + rand(-8,8);
    var white = (palIdx === 2);
    return { hue:h, sat: white ? 0 : 100, light: white ? 95 : 60 };
  }

  function launch(tx, ty, col){
    rockets.push({ x: tx, y: H, vy: -(rand(8.5, 11)), ty: ty, col: col });
  }

  function burst(x, y, col){
    boomSound();
    var n = 80;
    for(var i=0;i<n;i++){
      var a = (Math.PI*2)*(i/n);
      var sp = rand(2, 7.5);
      sparks.push({
        x:x, y:y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 1, decay: rand(0.008, 0.02),
        hue: col.hue + rand(-14,14), sat: col.sat, light: col.light
      });
    }
    palIdx = (palIdx + 1) % palettes.length;
  }

  function tick(){
    ctx.fillStyle = 'rgba(10,14,26,0.25)';
    ctx.fillRect(0,0,W,H);

    for(var i=rockets.length-1;i>=0;i--){
      var r = rockets[i];
      r.y += r.vy;
      ctx.fillStyle = hsl(r.col.hue, r.col.sat, 80);
      ctx.beginPath(); ctx.arc(r.x, r.y, 2.5, 0, Math.PI*2); ctx.fill();
      if(r.y <= r.ty || r.vy >= -1){ burst(r.x, r.y, r.col); rockets.splice(i,1); }
    }

    for(var j=sparks.length-1;j>=0;j--){
      var s = sparks[j];
      s.vx *= 0.98; s.vy = s.vy*0.98 + 0.05;
      s.x += s.vx; s.y += s.vy; s.life -= s.decay;
      if(s.life <= 0){ sparks.splice(j,1); continue; }
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = hsl(s.hue, s.sat, s.light);
      ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  c.addEventListener('click', function(e){
    ensureAudio();
    var rect = c.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (W/rect.width);
    var y = (e.clientY - rect.top) * (H/rect.height);
    launch(x, y, nextColor());
  });

  // ---- Auto-fire continuously ----
  function scheduleNext(){
    var delay = rand(500, 1100);
    setTimeout(function(){
      launch(rand(W*0.15, W*0.85), rand(H*0.30, H*0.55), nextColor());
      scheduleNext();
    }, delay);
  }
  scheduleNext();

  tick();
})();
</script>
</body>
</html>
